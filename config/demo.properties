# FairLease - demo configuration used for the class presentation
# Start with:  java -cp out fairlease.Main --demo
# A separate data folder is filled with sample users, a rented apartment and photos.

data.dir=data-demo
currency=RON

# Short deadlines so automatic rules can be shown live
inspection.response.hours=1
deposit.return.days=3
repair.escalation.hours=1

# Fewer photos to type during a live demo
inspection.photos=DAMAGED_ONLY
photo.max.mb=10

# Call center always open during the presentation
callcenter.opens=00:00
callcenter.closes=23:59

agent.registration.code=DEMO-AGENT
