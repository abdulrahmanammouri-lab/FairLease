# FairLease - normal configuration
# Start with:  java -cp out fairlease.Main

# Folder where all data files, photos and documents are stored
data.dir=data
currency=RON

# Hours the landlord has to confirm an inspection report before it is accepted automatically (FR-20)
inspection.response.hours=72
# Days after the move-out report during which the landlord may claim deductions; then the deposit is returned (FR-33)
deposit.return.days=14
# Urgent repairs still open after this many hours are escalated to the call center (FR-42)
repair.escalation.hours=24

# ALL_ITEMS = every item must be photographed; DAMAGED_ONLY = only worn/damaged items and meters
inspection.photos=ALL_ITEMS
photo.max.mb=10

callcenter.opens=09:00
callcenter.closes=18:00

# Secret code a call center employee needs to create an agent account
agent.registration.code=FL-AGENT-2026
